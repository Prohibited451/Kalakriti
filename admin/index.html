<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f3f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#140b15" media="(prefers-color-scheme: dark)">
<title>Kalakriti - Shop editor</title>
<style>
:root{--bg:#f4f3f7;--card:#fff;--line:#e7e4ec;--ink:#1d1520;--mute:#6b6170;--accent:#6b1533;--on:#fff;--soft:rgba(107,21,51,.07);--gold:#b8923a;--err:#b3261e;--ok:#1f7a45}
@media (prefers-color-scheme:dark){:root{--bg:#140b15;--card:#1f1421;--line:#35263a;--ink:#f4eef3;--mute:#b9aab8;--accent:#d9b66a;--on:#241508;--soft:rgba(227,194,124,.14);--gold:#e3c27c;--err:#ff9a90;--ok:#6fd49a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:120px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1{font-size:26px;letter-spacing:-.03em;margin:22px 0 2px}
h2{font-size:18px;margin:0 0 10px}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
label{display:block;font-weight:700;font-size:13.5px;margin:12px 0 5px}
label:first-child{margin-top:0}
input[type=text],input[type=number],textarea{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
input:focus,textarea:focus{border-color:var(--gold);outline:0}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:44px;padding:0 18px;white-space:nowrap;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;touch-action:manipulation}
.btn.pri{background:var(--accent);color:var(--on);border-color:transparent}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ph{position:relative;width:84px;height:112px;border-radius:12px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(20,8,12,.7);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.ph .n{position:absolute;left:4px;bottom:4px;background:rgba(20,8,12,.7);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px}
.add{width:84px;height:112px;border-radius:12px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
.add input{display:none}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;min-height:44px}
.head b{font-size:16px}
.tag{font-size:12px;font-weight:700;background:var(--soft);border-radius:99px;padding:2px 10px;margin-left:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
#msg{font-size:13.5px;font-weight:600;line-height:1.3}
#msg.err{color:var(--err)}#msg.ok{color:var(--ok)}
.crow{display:flex;align-items:center;gap:8px;margin-top:8px}
.crow input[type=color]{width:52px;height:44px;padding:2px;border:1px solid var(--line);border-radius:12px;background:var(--bg);flex:none;cursor:pointer}
.crow input[type=text]{flex:1;min-width:0}
.crow .x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1;cursor:pointer;flex:none}
.pres{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pre{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 8px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:700;cursor:pointer}
.pre i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:inline-block}
.pre:disabled{opacity:.4;cursor:default}
.hide{display:none!important}
.center{text-align:center;padding:60px 0}
a{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="center hide">
    <h1>Shop editor</h1>
    <p class="mute">Sign in with the GitHub account that owns this shop.</p>
    <p><a class="btn pri" style="display:inline-flex;align-items:center;text-decoration:none" href="/.auth/login/github?post_login_redirect_uri=/admin/">Sign in with GitHub</a></p>
  </div>

  <div id="app" class="hide">
    <h1>Shop editor</h1>
    <p class="mute" id="who"></p>

    <div class="card" id="settings"></div>

    <h2 style="margin-top:22px">Products</h2>
    <p class="mute" style="margin:0">Items without a photo are shown at the bottom of the shop automatically.</p>
    <div id="list"></div>
    <div class="tools"><button type="button" class="btn pri" id="addProd">Add a product</button></div>
  </div>
  <div id="fatal" class="center hide"></div>
</div>

<div class="bar hide" id="bar"><div class="in">
  <div id="msg" role="status"></div>
  <button type="button" class="btn pri" id="save" disabled>Save changes</button>
</div></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var state = {settings:{}, products:[]}, dirty = false, deletedCodes = [], open = {};
  var PRESETS = [["Red","#c4162a"],["White","#f4f1ea"],["Gold","#c8922a"],["Black","#1d1a1a"],["Blue","#2456a6"],["Green","#2f8a4f"],["Pink","#e58aa6"],["Silver","#b8bcc2"],["Copper","#b5693c"],["Yellow","#f0c52a"],["Orange","#e8782a"],["Purple","#7a3fa0"],["Maroon","#7a1630"],["Brown","#6b4226"]];
  var PRESET_HEX = {}; PRESETS.forEach(function(p){ PRESET_HEX[p[0].toLowerCase()] = p[1]; });
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };

  function say(text, cls){ var m = $("msg"); m.textContent = text || ""; m.className = cls || ""; }
  function setDirty(v){ dirty = v; $("save").disabled = !v; if (v) say("Unsaved changes"); }

  // ---------- startup ----------
  fetch("/.auth/me").then(function(r){ return r.json(); }).then(function(j){
    var p = j && j.clientPrincipal;
    if (!p){ $("login").classList.remove("hide"); return; }
    $("who").textContent = "Signed in as " + p.userDetails + ". ";
    var out = document.createElement("a"); out.href = "/.auth/logout?post_logout_redirect_uri=/"; out.textContent = "Sign out"; $("who").appendChild(out);
    return load();
  }).catch(function(){ fatal("Could not reach the sign-in service."); });

  function fatal(t){ $("app").classList.add("hide"); $("bar").classList.add("hide"); $("fatal").textContent = t; $("fatal").classList.remove("hide"); }

  function load(){
    return fetch("/api/products", {cache:"no-store"}).then(function(r){
      if (r.status === 403) throw new Error("This GitHub account is not allowed to edit the shop.");
      if (!r.ok) throw new Error("Could not load the shop data (" + r.status + ").");
      return r.json();
    }).then(function(j){
      state = {settings: j.data.settings || {}, products: j.data.products || []};
      var names = (j.photos || []).map(function(p){ return p.name; });
      state.products.forEach(function(p){
        var mine = names.filter(function(n){ return n.indexOf(p.code + "-") === 0 && /-[1-5]\.jpg$/.test(n); }).sort();
        p._photos = mine.map(function(n){ return {keep:n, url:"/photos/" + n + "?t=" + Date.now()}; });
        p._photosDirty = false;
        p.colors = (p.colors || []).map(function(c){
          var name = typeof c === "string" ? c : (c && c.name) || "";
          var hex = (c && typeof c === "object" && c.hex) || PRESET_HEX[name.toLowerCase()] || "#9a9a9a";
          return {name:name, hex:hex};
        });
      });
      deletedCodes = []; render();
      $("app").classList.remove("hide"); $("bar").classList.remove("hide"); setDirty(false); say("");
    }).catch(function(e){ fatal(e.message || "Something went wrong."); });
  }

  // ---------- render ----------
  function render(){ renderSettings(); renderList(); }

  function renderSettings(){
    var s = state.settings;
    $("settings").innerHTML = '<h2>Shop settings</h2>' +
      '<label for="s-wa">WhatsApp number (country code first, digits only)</label><input type="text" id="s-wa" inputmode="numeric" value="' + esc(s.whatsappNumber) + '">' +
      '<div class="row"><div><label for="s-fee">Noida delivery fee (rupees, blank = off)</label><input type="number" id="s-fee" inputmode="numeric" min="0" value="' + esc(s.noidaFee == null ? "" : s.noidaFee) + '"></div>' +
      '<div><label for="s-days">Normal delivery time</label><input type="text" id="s-days" value="' + esc(s.shipDays) + '"></div></div>' +
      '<label for="s-cut">Order-by date for Before Diwali items</label><input type="text" id="s-cut" value="' + esc(s.preDiwaliCutoff) + '">';
    $("s-wa").oninput = function(){ s.whatsappNumber = this.value.replace(/\D/g, ""); setDirty(true); };
    $("s-fee").oninput = function(){ s.noidaFee = this.value === "" ? null : Math.max(0, Math.round(Number(this.value))); setDirty(true); };
    $("s-days").oninput = function(){ s.shipDays = this.value; setDirty(true); };
    $("s-cut").oninput = function(){ s.preDiwaliCutoff = this.value; setDirty(true); };
  }

  function renderList(){
    var list = $("list"); list.innerHTML = "";
    state.products.forEach(function(p, i){
      var c = document.createElement("div"); c.className = "card";
      var isOpen = !!open[p._id || p.code];
      c.innerHTML = '<div class="head" role="button" tabindex="0" aria-expanded="' + isOpen + '"><span><b>' + esc(p.name || "New product") + '</b><span class="tag">' + esc(p.code) + '</span></span><span class="mute">' + (p.price ? "₹" + esc(p.price) : "") + (isOpen ? " ▴" : " ▾") + '</span></div>';
      var head = c.firstChild;
      var toggle = function(){ open[p._id || p.code] = !isOpen; renderList(); };
      head.onclick = toggle; head.onkeydown = function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } };
      if (isOpen) c.appendChild(editor(p, i));
      list.appendChild(c);
    });
  }

  function field(p, key, label, attrs){
    var id = "f-" + (p._id || p.code) + "-" + key;
    return '<label for="' + id + '">' + label + '</label><input id="' + id + '" data-k="' + key + '" ' + (attrs || 'type="text"') + '>';
  }

  function editor(p, i){
    var w = document.createElement("div");
    var uid = p._id || p.code;
    w.innerHTML =
      '<label for="n-' + uid + '">Name</label><input type="text" id="n-' + uid + '" maxlength="80">' +
      '<div class="row"><div><label for="p-' + uid + '">Price (rupees)</label><input type="number" id="p-' + uid + '" inputmode="numeric" min="1"></div>' +
      '<div><label for="c-' + uid + '">Code</label><input type="text" id="c-' + uid + '" maxlength="12"' + (p._new ? "" : " readonly") + '></div></div>' +
      '<label class="check"><input type="checkbox" id="d-' + uid + '"> Ready before Diwali</label>' +
      '<label for="sh-' + uid + '">Shipping text (optional, replaces the default, e.g. Ships in 1 day)</label><input type="text" id="sh-' + uid + '" maxlength="40">' +
      '<label>Colours (optional, shown to customers as swatches)</label><div id="cl-' + uid + '"></div>' +
      '<label for="ds-' + uid + '">Description (optional)</label><textarea id="ds-' + uid + '" maxlength="200"></textarea>' +
      '<label>Photos (first photo is the cover, up to 5)</label><div class="photos" id="ph-' + uid + '"></div>' +
      '<div class="tools"><button type="button" class="btn" data-a="up">Move up</button><button type="button" class="btn" data-a="down">Move down</button><button type="button" class="btn danger" data-a="del">Delete product</button></div>';
    var q = function(id){ return w.querySelector("#" + id + "-" + uid); };
    var inp = {n:w.querySelector("#n-" + uid), p:w.querySelector("#p-" + uid), c:w.querySelector("#c-" + uid), d:w.querySelector("#d-" + uid), sh:w.querySelector("#sh-" + uid), ds:w.querySelector("#ds-" + uid)};
    inp.n.value = p.name || ""; inp.p.value = p.price || ""; inp.c.value = p.code || ""; inp.d.checked = !!p.preDiwali;
    inp.sh.value = p.ship || ""; inp.ds.value = p.description || "";
    inp.n.oninput = function(){ p.name = this.value; w.parentNode.querySelector(".head b").textContent = this.value || "New product"; setDirty(true); };
    inp.p.oninput = function(){ p.price = Math.round(Number(this.value)) || 0; setDirty(true); };
    inp.c.oninput = function(){ p.code = this.value.trim(); setDirty(true); };
    inp.d.onchange = function(){ p.preDiwali = this.checked; setDirty(true); };
    inp.sh.oninput = function(){ p.ship = this.value; setDirty(true); };
    inp.ds.oninput = function(){ p.description = this.value; setDirty(true); };
    renderPhotos(p, w.querySelector("#ph-" + uid));
    renderColors(p, w.querySelector("#cl-" + uid));
    w.querySelector('[data-a="up"]').onclick = function(){ move(i, -1); };
    w.querySelector('[data-a="down"]').onclick = function(){ move(i, 1); };
    w.querySelector('[data-a="del"]').onclick = function(){
      if (!confirm("Delete " + (p.name || "this product") + " and its photos?")) return;
      if (!p._new) deletedCodes.push(p.code);
      state.products.splice(i, 1); setDirty(true); renderList();
    };
    return w;
  }

  function move(i, d){ var j = i + d; if (j < 0 || j >= state.products.length) return; var t = state.products[i]; state.products[i] = state.products[j]; state.products[j] = t; setDirty(true); renderList(); }

  function renderColors(p, box){
    box.innerHTML = "";
    p.colors = p.colors || [];
    p.colors.forEach(function(col, k){
      var r = document.createElement("div"); r.className = "crow";
      r.innerHTML = '<input type="color" aria-label="Pick colour ' + (k + 1) + '"><input type="text" maxlength="20" placeholder="Colour name" aria-label="Name of colour ' + (k + 1) + '"><button type="button" class="x" aria-label="Remove colour ' + (k + 1) + '">&times;</button>';
      var pick = r.children[0], nm = r.children[1], x = r.children[2];
      pick.value = col.hex || "#9a9a9a"; nm.value = col.name || "";
      pick.oninput = function(){ col.hex = this.value; setDirty(true); };
      nm.oninput = function(){ col.name = this.value; setDirty(true); };
      x.onclick = function(){ p.colors.splice(k, 1); setDirty(true); renderColors(p, box); };
      box.appendChild(r);
    });
    var full = p.colors.length >= 8;
    var pres = document.createElement("div"); pres.className = "pres";
    PRESETS.forEach(function(pr){
      var b = document.createElement("button"); b.type = "button"; b.className = "pre"; b.disabled = full;
      b.innerHTML = '<i style="background:' + pr[1] + '"></i>' + pr[0];
      b.onclick = function(){
        if (p.colors.some(function(c){ return (c.name || "").toLowerCase() === pr[0].toLowerCase(); })) return;
        p.colors.push({name:pr[0], hex:pr[1]}); setDirty(true); renderColors(p, box);
      };
      pres.appendChild(b);
    });
    var cu = document.createElement("button"); cu.type = "button"; cu.className = "pre"; cu.disabled = full; cu.textContent = "+ Custom colour";
    cu.onclick = function(){ p.colors.push({name:"", hex:"#c4162a"}); setDirty(true); renderColors(p, box); var ins = box.querySelectorAll(".crow input[type=text]"); if (ins.length) ins[ins.length - 1].focus(); };
    pres.appendChild(cu);
    box.appendChild(pres);
  }

  function renderPhotos(p, box){
    box.innerHTML = "";
    p._photos.forEach(function(ph, k){
      var d = document.createElement("div"); d.className = "ph";
      d.innerHTML = '<img alt=""><span class="n">' + (k + 1) + '</span><button type="button" aria-label="Remove photo ' + (k + 1) + '">&times;</button>';
      d.querySelector("img").src = ph.url;
      d.querySelector("button").onclick = function(){ p._photos.splice(k, 1); p._photosDirty = true; setDirty(true); renderPhotos(p, box); };
      box.appendChild(d);
    });
    if (p._photos.length < 5){
      var a = document.createElement("label"); a.className = "add";
      a.innerHTML = '+ Add photo<input type="file" accept="image/*" multiple>';
      a.querySelector("input").onchange = function(){
        var files = Array.prototype.slice.call(this.files, 0, 5 - p._photos.length), self = this;
        say("Preparing photos...");
        files.reduce(function(pr, f){ return pr.then(function(){ return toJpeg(f).then(function(r){ p._photos.push({b64:r.b64, url:r.url}); }); }); }, Promise.resolve())
          .then(function(){ p._photosDirty = true; setDirty(true); renderPhotos(p, box); })
          .catch(function(){ say("That file could not be used as a photo.", "err"); });
        self.value = "";
      };
      box.appendChild(a);
    }
  }

  // Resize to at most 1200px and under 300 KB, as a JPEG.
  function toJpeg(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file), img = new Image();
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("bad image")); };
      img.onload = function(){
        var dims = [1200, 1000, 800, 640], qs = [0.85, 0.75, 0.65, 0.55], out = null;
        outer: for (var a = 0; a < dims.length; a++){
          var sc = Math.min(1, dims[a] / Math.max(img.naturalWidth, img.naturalHeight));
          var cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
          cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
          for (var b = 0; b < qs.length; b++){
            var data = cv.toDataURL("image/jpeg", qs[b]), bytes = Math.floor((data.length - 23) * 0.75);
            out = data; if (bytes <= 300 * 1024) break outer;
          }
        }
        URL.revokeObjectURL(url);
        resolve({url: out, b64: out.split(",")[1]});
      };
      img.src = url;
    });
  }

  // ---------- add product ----------
  $("addProd").onclick = function(){
    var max = 0; state.products.forEach(function(p){ var m = /^P-(\d+)$/.exec(p.code); if (m) max = Math.max(max, +m[1]); });
    var code = "P-" + String(max + 1).padStart(2, "0"), id = "new" + Date.now();
    state.products.push({code:code, name:"", price:0, preDiwali:false, description:"", _new:true, _id:id, _photos:[], _photosDirty:false});
    open[id] = true; setDirty(true); renderList();
    var cards = $("list").children; cards[cards.length - 1].scrollIntoView({behavior:"smooth", block:"start"});
  };

  // ---------- save ----------
  $("save").onclick = function(){
    var problems = validate();
    if (problems){ say(problems, "err"); return; }
    var photos = {};
    state.products.forEach(function(p){ if (p._photosDirty) photos[p.code] = p._photos.map(function(x){ return x.keep ? {keep:x.keep} : {b64:x.b64}; }); });
    deletedCodes.forEach(function(c){ photos[c] = []; });
    var body = {
      settings: {whatsappNumber:state.settings.whatsappNumber, noidaFee:state.settings.noidaFee == null ? null : state.settings.noidaFee, shipDays:(state.settings.shipDays || "").trim(), preDiwaliCutoff:(state.settings.preDiwaliCutoff || "").trim()},
      products: state.products.map(function(p){
        var o = {code:p.code, name:p.name.trim(), price:p.price, preDiwali:!!p.preDiwali, description:(p.description || "").trim()};
        if ((p.ship || "").trim()) o.ship = p.ship.trim();
        if (p.colors && p.colors.length) o.colors = p.colors.map(function(c){ return {name:c.name.trim(), hex:c.hex}; });
        return o;
      }),
      photos: photos
    };
    $("save").disabled = true; say("Saving...");
    fetch("/api/save", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok) throw new Error(j.error || ("Save failed (" + r.status + ")")); return j; }); })
      .then(function(){ return load(); })
      .then(function(){ say("Saved. The shop updates in about 2 minutes.", "ok"); })
      .catch(function(e){ $("save").disabled = false; say(e.message, "err"); });
  };

  function validate(){
    var s = state.settings;
    if (!/^\d{10,15}$/.test(s.whatsappNumber || "")) return "WhatsApp number must be 10 to 15 digits, country code first.";
    if (!(s.shipDays || "").trim()) return "Add the normal delivery time (for example 3-6 days).";
    if (!(s.preDiwaliCutoff || "").trim()) return "Add the order-by date for Before Diwali items.";
    if (!state.products.length) return "Add at least one product.";
    var seen = {};
    for (var i = 0; i < state.products.length; i++){
      var p = state.products[i], label = p.name ? p.name : "A new product";
      if (!/^[A-Za-z0-9-]{1,12}$/.test(p.code || "")) return label + ": the code can only use letters, numbers and dashes.";
      if (seen[p.code]) return "The code " + p.code + " is used twice.";
      seen[p.code] = 1;
      if (!(p.name || "").trim()) return "Every product needs a name.";
      if (!(p.price > 0)) return label + ": add a price.";
      for (var k = 0; k < (p.colors || []).length; k++){ if (!(p.colors[k].name || "").trim()) return label + ": every colour needs a name."; }
    }
    return "";
  }

  window.addEventListener("beforeunload", function(e){ if (dirty){ e.preventDefault(); e.returnValue = ""; } });
})();
</script>
</body>
</html>
