<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kalakriti - Order</title>
<meta name="description" content="Handmade candles, diyas and 3D-printed decor from Kalakriti, Noida.">
<style>
/* Design: cream, maroon and gold. Corners: 14px for cards, inputs and buttons; pills for chips and badges. */
:root{
  --bg:#fbf5ea;--surface:#fffdf8;--ink:#2a1a17;--mute:#74625a;--line:#eadfc9;
  --accent:#6b1526;--on-accent:#ffffff;--accent-soft:#f4e4e1;--gold:#a8791f;--gold-soft:#f3e6c0;--gold-ink:#6b4a05;
  --ph1:#f6ecd2;--ph2:#ecdcb4;--err:#b3261e;--shadow:0 1px 2px rgba(80,40,20,.06),0 8px 24px -12px rgba(80,40,20,.18);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c0f11;--surface:#291619;--ink:#f6ebdc;--mute:#b8a496;--line:#43272b;
  --accent:#e0ae52;--on-accent:#2a1209;--accent-soft:#3a2024;--gold:#e0ae52;--gold-soft:#463315;--gold-ink:#f0cf8c;
  --ph1:#3a2226;--ph2:#2c191c;--err:#ff8a80;--shadow:0 8px 24px -12px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* top */
.top{padding:28px 0 18px}
.brand{font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1;color:var(--accent)}
.top .tag{margin:8px 0 0;color:var(--mute);font-size:15px}
.facts{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0}
.facts li{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.cutoff{margin:14px 0 0;font-size:13.5px;color:var(--gold-ink);background:var(--gold-soft);border-radius:var(--r);padding:10px 12px}

/* filters */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px;margin:0 -16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;cursor:pointer;touch-action:manipulation}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.ph{position:relative;aspect-ratio:4/5;background:linear-gradient(160deg,var(--ph1),var(--ph2));display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.has{cursor:pointer}
.ph .nophoto{padding:14px;text-align:center;font-weight:700;font-size:15px;line-height:1.25;color:var(--accent)}
.ph .more{position:absolute;right:8px;bottom:8px;background:rgba(30,12,14,.72);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;display:none}
.ph.multi .more{display:block}
.info{padding:12px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.badge{font-size:12px;font-weight:700;color:var(--gold-ink)}
.badge.ship{color:var(--mute);font-weight:600}
.name{font-weight:650;font-size:15px;line-height:1.25}
.code{font-size:12px;color:var(--mute)}
.desc{font-size:13px;color:var(--mute)}
.price{font-weight:800;font-size:18px;margin-top:6px}
.ctl{margin-top:8px}
.add{width:100%;min-height:44px;border-radius:var(--r);border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;cursor:pointer;touch-action:manipulation}
.add:active{background:var(--accent);color:var(--on-accent)}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--accent);color:var(--on-accent);border-radius:var(--r);min-height:44px}
.step button{width:48px;height:44px;border:0;background:transparent;color:inherit;font-size:22px;font-weight:600;cursor:pointer;touch-action:manipulation}
.step output{font-weight:800;font-size:17px}
.hide{display:none!important}

/* order form */
section.order{padding-top:28px}
h2{font-size:22px;letter-spacing:-.01em;margin:0 0 4px}
.sub{margin:0 0 14px;color:var(--mute);font-size:14.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
label.f{display:block;font-weight:650;font-size:14px;margin:14px 0 6px}
label.f:first-child{margin-top:0}
input[type=text],input[type=tel],textarea{width:100%;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.85}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus{border-color:var(--gold);outline:0;box-shadow:0 0 0 3px var(--gold-soft)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg);min-height:52px;cursor:pointer}
.opt input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.opt b{display:block;font-weight:650;font-size:15px}
.opt small{display:block;color:var(--mute);font-size:13px;margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.dis{opacity:.5;cursor:not-allowed}
.err{color:var(--err);font-size:13.5px;margin-top:6px;font-weight:600}
.err:empty{display:none}

.sum{font-size:14.5px}
.sum .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;color:var(--mute)}
.sum .row span:last-child{color:var(--ink);font-weight:600;white-space:nowrap}
.sum .empty{color:var(--mute)}
.totalrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.totalrow span{font-weight:650}
.totalrow strong{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.note{font-size:13.5px;color:var(--gold-ink);background:var(--gold-soft);border-radius:var(--r);padding:10px 12px;margin-top:12px}
#go{width:100%;margin-top:14px;min-height:56px;border:0;border-radius:var(--r);background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:800;cursor:pointer;touch-action:manipulation;transition:transform .15s}
#go:active{transform:translateY(1px) scale(.99)}
#done{margin-top:14px;padding:16px;border-radius:var(--r);background:var(--gold-soft);border:1.5px solid var(--gold);color:var(--gold-ink);font-weight:650}
#done p{margin:0 0 8px}#done p:last-child{margin:0}
#done a{color:inherit;font-weight:600}
footer{text-align:center;color:var(--mute);font-size:13.5px;padding:28px 16px 12px}

/* cart bar */
#cart{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .25s cubic-bezier(.16,1,.3,1)}
#cart.on{transform:none}
#cart .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
#cart .n{font-size:13.5px;color:var(--mute)}
#cart .t{font-weight:800;font-size:20px;line-height:1.1}
#cart a{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:var(--r);background:var(--accent);color:var(--on-accent);font-weight:800;text-decoration:none}

/* gallery */
#gal{position:fixed;inset:0;background:#1a0b0e;z-index:50;display:none;flex-direction:column}
#gal.on{display:flex}
#gal header{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 16px;color:#fff}
#gal .t{font-weight:650;font-size:15px}
#gal .c{font-size:13px;opacity:.8}
#gx{width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:28px;line-height:1;cursor:pointer;touch-action:manipulation}
#gs{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
#gs::-webkit-scrollbar{display:none}
#gs .sl{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:8px}
#gs img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:var(--r)}
#gd{display:flex;justify-content:center;gap:8px;padding:14px}
#gd i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35)}
#gd i.on{background:#f0cf8c}

@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}#cart,#go{transition:none}}
</style>
</head>
<body>

<script>
/* ===================================================================
   CONFIG - EDIT THIS BLOCK ONLY. Everything below it is page code.
   =================================================================== */
const WHATSAPP_NUMBER   = "918448412211";   // country code + number, digits only
const UPI_ID            = "[xxx@upi]";      // TODO: your UPI ID (not shown on page; for your reference)
const NOIDA_DELIVERY_FEE = 150;             // flat fee in rupees for Noida delivery
const PRE_DIWALI_CUTOFF = "Sat 7 Nov 2026"; // shown in the order-by note at the top
// Photos: put 1-5 files in photos/ named <code>-<n>.jpg (P-01-1.jpg, P-01-2.jpg ...). No other setting needed.
// preDiwali: true = "Before Diwali", false = "Ships in 7-10 days"
const PRODUCTS = [
  {code:"C-01", name:"Wax-filled diyas, set of 6", price:199,  preDiwali:true,  description:""},
  {code:"C-02", name:"Soy jar candle 150g",        price:249,  preDiwali:true,  description:""},
  {code:"C-03", name:"Gel jar candle",             price:299,  preDiwali:true,  description:""},
  {code:"C-04", name:"Candle gift pair",           price:499,  preDiwali:true,  description:""},
  {code:"P-01", name:"Ganesha idol (gold)",        price:599,  preDiwali:true,  description:""},
  {code:"P-02", name:"Floral lantern with LED tealight", price:399, preDiwali:true, description:""},
  {code:"P-03", name:"Leaf lamp",                  price:1999, preDiwali:false, description:""},
  {code:"P-04", name:"Ribbed mushroom lamp",       price:999,  preDiwali:false, description:""},
  {code:"P-05", name:"Gold cube box",              price:799,  preDiwali:false, description:""},
  {code:"P-06", name:"Jewellery dish",             price:699,  preDiwali:false, description:""},
  {code:"P-07", name:"Spinning star top",          price:199,  preDiwali:true,  description:""},
  {code:"P-08", name:"Ballerina",                  price:499,  preDiwali:false, description:""},
  {code:"P-09", name:"Toy car",                    price:349,  preDiwali:false, description:""},
  {code:"P-10", name:"Infinity Torus desk fidget", price:599,  preDiwali:false, description:""}
];
/* ================== END OF CONFIG ================================== */
</script>

<div class="wrap">
  <header class="top">
    <div class="brand">Kalakriti</div>
    <p class="tag">Handmade candles, diyas and 3D-printed d&eacute;cor from Noida.</p>
    <ul class="facts" id="facts"></ul>
    <p class="cutoff" id="cutoff"></p>
  </header>
</div>

<div id="shop">
<div class="bar"><div class="wrap">
  <div class="chips" role="group" aria-label="Filter products">
    <button type="button" class="chip" data-f="all" aria-pressed="true">All</button>
    <button type="button" class="chip" data-f="pre" aria-pressed="false">Before Diwali</button>
    <button type="button" class="chip" data-f="C" aria-pressed="false">Candles and diyas</button>
    <button type="button" class="chip" data-f="P" aria-pressed="false">3D-printed d&eacute;cor</button>
  </div>
</div></div>

<div class="wrap">
  <div class="grid" id="grid"></div>
</div>
</div>

<main class="wrap">

  <section class="order" id="order">
    <h2>Your order</h2>
    <p class="sub">Fill this in and we will open WhatsApp with your order ready to send.</p>
    <form id="f" novalidate autocomplete="off" onsubmit="return false">
      <div class="panel">
        <label class="f" for="name">Name</label>
        <input type="text" id="name" maxlength="60" autocomplete="off">
        <div class="err" id="e-name"></div>
        <label class="f" for="phone">Your WhatsApp number</label>
        <input type="tel" id="phone" inputmode="numeric" maxlength="16" placeholder="10-digit mobile number" autocomplete="off">
        <div class="err" id="e-phone"></div>
      </div>

      <div class="panel">
        <label class="f" id="dl">Delivery</label>
        <div class="opts" role="radiogroup" aria-labelledby="dl">
          <label class="opt sel" id="o-Pickup"><input type="radio" name="dt" value="Pickup" checked><span><b>Stall pickup</b><small>Collect from us at the stall</small></span></label>
          <label class="opt" id="o-Society"><input type="radio" name="dt" value="Society"><span><b>Society flat delivery</b><small>Free</small></span></label>
          <label class="opt" id="o-Noida"><input type="radio" name="dt" value="Noida"><span><b id="noida-t">Noida delivery</b><small id="noida-s">Prepaid only</small></span></label>
        </div>
        <div id="soc" class="hide">
          <label class="f" for="tower">Tower</label>
          <input type="text" id="tower" maxlength="20" autocomplete="off">
          <label class="f" for="flat">Flat number</label>
          <input type="text" id="flat" maxlength="20" autocomplete="off">
          <div class="err" id="e-soc"></div>
        </div>
        <div id="noi" class="hide">
          <label class="f" for="addr">Full address</label>
          <textarea id="addr" maxlength="250" autocomplete="off"></textarea>
          <label class="f" for="pin">Pincode</label>
          <input type="text" id="pin" inputmode="numeric" maxlength="6" autocomplete="off">
          <div class="err" id="e-noi"></div>
        </div>
      </div>

      <div class="panel">
        <label class="f" for="notes">Notes (optional)</label>
        <textarea id="notes" maxlength="200" placeholder="Custom name, colour, gift wrap" autocomplete="off"></textarea>
      </div>

      <div class="panel sum">
        <div id="lines"></div>
        <div class="totalrow"><span>Total</span><strong id="total">&#8377;0</strong></div>
        <div class="note hide" id="mixnote"></div>
        <div class="err" id="e-cart"></div>
        <button type="button" id="go">Place order on WhatsApp</button>
      </div>
    </form>

    <div id="done" class="hide" role="status"></div>
  </section>
</main>

<footer>Lanterns and lamps use LED lights only.</footer>

<div id="cart" aria-live="polite"><div class="in">
  <div><div class="n" id="cn"></div><div class="t" id="ct"></div></div>
  <a href="#order">Review order</a>
</div></div>

<div id="gal" role="dialog" aria-modal="true" aria-label="Product photos">
  <header><div><div class="t" id="gt"></div><div class="c" id="gc"></div></div><button type="button" id="gx" aria-label="Close photos">&times;</button></header>
  <div id="gs"></div>
  <div id="gd"></div>
</div>

<script>
(function(){
  var qty = {};
  var $ = function(id){return document.getElementById(id)};
  var rs = function(n){return "₹" + n};
  var rsf = function(n){return "₹" + n.toLocaleString("en-IN")};
  var feeOk = typeof NOIDA_DELIVERY_FEE === "number" && NOIDA_DELIVERY_FEE >= 0;

  // ---- top strip ----
  [ "Stall pickup", "Free society delivery", feeOk ? "Noida delivery +" + rsf(NOIDA_DELIVERY_FEE) : "" ].forEach(function(t){
    if (!t) return; var li = document.createElement("li"); li.textContent = t; $("facts").appendChild(li);
  });
  $("cutoff").textContent = "Order Before Diwali items by " + PRE_DIWALI_CUTOFF + ". Other items ship in 7-10 days.";

  // ---- grid ----
  var grid = $("grid"), cardEl = {};
  PRODUCTS.forEach(function(p){
    qty[p.code] = 0;
    var c = document.createElement("article"); c.className = "card"; c.dataset.group = p.code.charAt(0); c.dataset.pre = p.preDiwali ? "1" : "0";
    cardEl[p.code] = c;
    var ph = document.createElement("div"); ph.className = "ph";
    var np = document.createElement("div"); np.className = "nophoto"; np.textContent = p.name; ph.appendChild(np);
    var more = document.createElement("span"); more.className = "more"; more.textContent = "More photos"; ph.appendChild(more);
    var img = new Image(); img.alt = p.name; img.decoding = "async";
    img.onload = function(){ np.remove(); ph.insertBefore(img, ph.firstChild); ph.classList.add("has");
      ph.setAttribute("role","button"); ph.setAttribute("tabindex","0"); ph.setAttribute("aria-label","View photos of " + p.name);
      ph.onclick = function(){ openGal(p, ph); };
      ph.onkeydown = function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openGal(p, ph); } };
      var t = new Image(); t.onload = function(){ ph.classList.add("multi"); }; t.src = "photos/" + p.code + "-2.jpg"; };
    (function(){ var go = function(){ img.src = "photos/" + p.code + "-1.jpg"; };
      if ("IntersectionObserver" in window){ var io = new IntersectionObserver(function(es){ if (es[0].isIntersecting){ io.disconnect(); go(); } }, {rootMargin:"300px"}); io.observe(ph); } else go(); })();
    var b = document.createElement("div"); b.className = "info";
    var badge = document.createElement("span"); badge.className = "badge" + (p.preDiwali ? "" : " ship"); badge.textContent = p.preDiwali ? "Before Diwali" : "Ships in 7-10 days";
    var nm = document.createElement("div"); nm.className = "name"; nm.textContent = p.name;
    var cd = document.createElement("div"); cd.className = "code"; cd.textContent = p.code;
    b.appendChild(badge); b.appendChild(nm); b.appendChild(cd);
    if (p.description){ var d = document.createElement("div"); d.className = "desc"; d.textContent = p.description; b.appendChild(d); }
    var pr = document.createElement("div"); pr.className = "price"; pr.textContent = rsf(p.price); b.appendChild(pr);
    var ctl = document.createElement("div"); ctl.className = "ctl";
    var add = document.createElement("button"); add.type = "button"; add.className = "add"; add.textContent = "Add"; add.setAttribute("aria-label","Add " + p.name);
    var st = document.createElement("div"); st.className = "step hide";
    var m = document.createElement("button"); m.type = "button"; m.textContent = "−"; m.setAttribute("aria-label","Remove one " + p.name);
    var o = document.createElement("output"); o.setAttribute("aria-label","Quantity");
    var a = document.createElement("button"); a.type = "button"; a.textContent = "+"; a.setAttribute("aria-label","Add one " + p.name);
    add.onclick = function(){ qty[p.code] = 1; upd(); };
    m.onclick = function(){ if (qty[p.code] > 0){ qty[p.code]--; upd(); } };
    a.onclick = function(){ if (qty[p.code] < 20){ qty[p.code]++; upd(); } };
    st.appendChild(m); st.appendChild(o); st.appendChild(a); ctl.appendChild(add); ctl.appendChild(st); b.appendChild(ctl);
    c._add = add; c._st = st; c._o = o;
    c.appendChild(ph); c.appendChild(b); grid.appendChild(c);
  });

  // ---- filters ----
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(ch){
    ch.onclick = function(){
      Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(x){ x.setAttribute("aria-pressed", x === ch ? "true" : "false"); });
      var f = ch.dataset.f;
      PRODUCTS.forEach(function(p){ var c = cardEl[p.code];
        var show = f === "all" || (f === "pre" && p.preDiwali) || f === p.code.charAt(0);
        c.classList.toggle("hide", !show); });
    };
  });

  // ---- gallery ----
  var gal = $("gal"), gs = $("gs"), gd = $("gd"), lastFocus = null;
  function openGal(p, from){
    lastFocus = from; gs.innerHTML = ""; gd.innerHTML = "";
    $("gt").textContent = p.name + " (" + p.code + ")";
    function refresh(){
      var slides = gs.children;
      $("gc").textContent = slides.length > 1 ? "Swipe for more. " + slides.length + " photos" : "";
      gd.innerHTML = ""; for (var i = 0; i < slides.length && slides.length > 1; i++){ gd.appendChild(document.createElement("i")); }
      dots();
    }
    for (var k = 1; k <= 5; k++) (function(k){
      var sl = document.createElement("div"); sl.className = "sl"; sl.dataset.k = k;
      var im = new Image(); im.alt = p.name + " photo " + k; im.decoding = "async";
      im.onload = function(){ sl.appendChild(im); var kids = gs.children, at = null;
        for (var j = 0; j < kids.length; j++){ if (+kids[j].dataset.k > k){ at = kids[j]; break; } }
        gs.insertBefore(sl, at); refresh(); };
      im.src = "photos/" + p.code + "-" + k + ".jpg";
    })(k);
    gal.classList.add("on"); document.body.style.overflow = "hidden"; $("gx").focus();
  }
  function dots(){ var w = gs.clientWidth || 1, i = Math.round(gs.scrollLeft / w), d = gd.children; for (var j = 0; j < d.length; j++) d[j].className = j === i ? "on" : ""; }
  gs.addEventListener("scroll", dots, {passive:true});
  function closeGal(){ gal.classList.remove("on"); document.body.style.overflow = ""; gs.innerHTML = ""; if (lastFocus) lastFocus.focus(); }
  $("gx").onclick = closeGal;
  gal.addEventListener("click", function(e){ if (e.target === gal || e.target === gs || e.target.className === "sl") closeGal(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && gal.classList.contains("on")) closeGal(); });

  // ---- delivery option labels ----
  if (feeOk){ $("noida-t").textContent = "Noida delivery (+" + rsf(NOIDA_DELIVERY_FEE) + ")"; }
  else { $("noida-s").textContent = "Not available yet"; document.querySelector('input[value="Noida"]').disabled = true; $("o-Noida").classList.add("dis"); }

  function dtype(){ return document.querySelector('input[name="dt"]:checked').value; }
  function fee(){ return dtype() === "Noida" && feeOk ? NOIDA_DELIVERY_FEE : 0; }
  function subtotal(){ return PRODUCTS.reduce(function(s,p){return s + p.price * qty[p.code]}, 0); }
  function esc(s){ return s.replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}); }

  function upd(){
    var dt = dtype(), sub = subtotal(), count = 0, pre = false, late = false, lines = "";
    PRODUCTS.forEach(function(p){
      var c = cardEl[p.code], q = qty[p.code];
      c._add.classList.toggle("hide", q > 0); c._st.classList.toggle("hide", q === 0); c._o.textContent = q;
      if (q){ count += q; if (p.preDiwali) pre = true; else late = true;
        lines += '<div class="row"><span>' + esc(p.name) + " ×" + q + "</span><span>" + rsf(p.price * q) + "</span></div>"; }
    });
    ["Pickup","Society","Noida"].forEach(function(k){ $("o-" + k).classList.toggle("sel", k === dt); });
    $("soc").classList.toggle("hide", dt !== "Society");
    $("noi").classList.toggle("hide", dt !== "Noida");
    if (fee()) lines += '<div class="row"><span>Noida delivery</span><span>' + rsf(fee()) + "</span></div>";
    $("lines").innerHTML = lines || '<div class="row empty"><span>No items yet. Tap Add on any product.</span></div>';
    var total = sub + fee();
    $("total").textContent = rsf(total);
    var mn = $("mixnote");
    if (pre && late){ mn.textContent = "Your order has items for before Diwali (by " + PRE_DIWALI_CUTOFF + ") and items that ship in 7-10 days."; mn.classList.remove("hide"); }
    else mn.classList.add("hide");
    $("cn").textContent = count + (count === 1 ? " item" : " items");
    $("ct").textContent = rsf(total);
    $("cart").classList.toggle("on", count > 0);
  }
  Array.prototype.forEach.call(document.querySelectorAll('input[name="dt"]'), function(r){ r.onchange = upd; });

  // ---- message (format is parsed by an automation: do not change) ----
  function clean(s){ return String(s || "").replace(/[\r\n\t]+/g, " ").replace(/[|;]/g, ",").replace(/\s+/g, " ").trim(); }
  function makeId(){
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", t = Date.now().toString(36).toUpperCase().slice(-3), r = "";
    var buf = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(3)) : [Math.random()*256, Math.random()*256, Math.random()*256];
    for (var i = 0; i < 3; i++) r += chars.charAt(Math.floor(buf[i]) % chars.length);
    return "KK-" + t + r;
  }
  function phoneDigits(v){
    var d = String(v).replace(/\D/g, "");
    if (d.length === 12 && d.indexOf("91") === 0) d = d.slice(2);
    else if (d.length === 11 && d.charAt(0) === "0") d = d.slice(1);
    return /^[6-9]\d{9}$/.test(d) ? d : "";
  }
  function build(){
    var errs = {cart:"", name:"", phone:"", soc:"", noi:""}, ok = true;
    var dt = dtype();
    if (!subtotal()){ errs.cart = "Please add at least one item."; ok = false; }
    var name = clean($("name").value);
    if (!name){ errs.name = "Please enter your name."; ok = false; }
    var phone = phoneDigits($("phone").value);
    if (!phone){ errs.phone = "Enter a valid 10-digit mobile number."; ok = false; }
    var addr = "-";
    if (dt === "Pickup") addr = "Stall";
    if (dt === "Society"){
      var tw = clean($("tower").value), fl = clean($("flat").value);
      if (!tw || !fl){ errs.soc = "Tower and flat number are required."; ok = false; }
      addr = "Tower " + tw + ", Flat " + fl;
    }
    if (dt === "Noida"){
      var ad = clean($("addr").value), pin = $("pin").value.replace(/\s/g, "");
      if (!ad || !/^\d{6}$/.test(pin)){ errs.noi = "Full address and a 6-digit pincode are required."; ok = false; }
      addr = ad + ", " + pin;
    }
    $("e-cart").textContent = errs.cart; $("e-name").textContent = errs.name; $("e-phone").textContent = errs.phone;
    $("e-soc").textContent = errs.soc; $("e-noi").textContent = errs.noi;
    if (!ok) return null;
    var items = PRODUCTS.filter(function(p){return qty[p.code]}).map(function(p){
      return p.code + " " + p.name + " x" + qty[p.code] + " = " + rs(p.price * qty[p.code]);
    }).join("; ");
    var id = makeId();
    var msg = "ORDER " + id + "\n" +
      "Items: " + items + "\n" +
      "Delivery: " + dt + " | " + addr + "\n" +
      "Total: " + rs(subtotal() + fee()) + "\n" +
      "Name: " + name + " | Phone: " + phone + "\n" +
      "Notes: " + (clean($("notes").value) || "-");
    return {msg: msg, dt: dt};
  }

  $("go").onclick = function(){
    var r = build();
    if (!r){
      var first = document.querySelector(".err:not(:empty)");
      if (first && first.scrollIntoView) first.scrollIntoView({block:"center", behavior:"smooth"});
      return;
    }
    var url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(r.msg);
    var d = $("done");
    d.innerHTML = "<p>Send the WhatsApp message to confirm. We'll reply with UPI payment details.</p>" +
      (r.dt === "Noida" ? "<p>Payment is required before dispatch.</p>" : "") +
      '<p><a id="again" href="' + url + '" target="_blank" rel="noopener">WhatsApp did not open? Tap here</a></p>';
    d.classList.remove("hide");
    window.open(url, "_blank");
    if (d.scrollIntoView) d.scrollIntoView({block:"center", behavior:"smooth"});
  };

  upd();
})();
</script>
</body>
</html>
