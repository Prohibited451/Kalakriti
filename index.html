<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f3f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#140b15" media="(prefers-color-scheme: dark)">
<title>Kalakriti - Order</title>
<meta name="description" content="Handmade candles, diyas and 3D-printed decor from Kalakriti, Noida.">
<style>
/* Plus Jakarta Sans (SIL Open Font License), self-hosted in fonts/ so no third-party request is made. */
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/pjs-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/pjs-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Design: flat and clean. Solid colours, hairline borders, no blur or glow. Radii: 22px cards and panels, 16px inputs, pills for buttons and chips. */
:root{
  --ink:#1d1520;--mute:#6b6170;--line:rgba(29,21,32,.10);
  --glass:#ffffff;--glass-edge:#e7e4ec;--glass-strong:#ffffff;
  --accent:#6b1533;--on-accent:#fff;--accent-solid:#6b1533;--accent-soft:rgba(107,21,51,.07);
  --gold:#b8923a;--gold-ink:#6a4f12;--gold-soft:rgba(201,167,92,.20);
  --ph1:#efecf2;--ph2:#e4dfea;--err:#b3261e;
  --shadow:0 1px 2px rgba(29,21,32,.05);
  --page:#f4f3f7;
  --glowA:transparent;--glowB:transparent;--glowC:transparent;
}
@media (prefers-color-scheme:dark){:root{
  --ink:#f4eef3;--mute:#b9aab8;--line:rgba(255,255,255,.12);
  --glass:#1f1421;--glass-edge:#35263a;--glass-strong:#1f1421;
  --accent:#d9b66a;--on-accent:#241508;--accent-solid:#e3c27c;--accent-soft:rgba(227,194,124,.14);
  --gold:#e3c27c;--gold-ink:#efd9a4;--gold-soft:rgba(227,194,124,.15);
  --ph1:#2e1f33;--ph2:#251829;--err:#ff9a90;
  --shadow:none;
  --page:#140b15;
  --glowA:transparent;--glowB:transparent;--glowC:transparent;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--page);background-attachment:fixed;color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;padding-bottom:calc(116px + env(safe-area-inset-bottom));min-height:100dvh}
.bg{display:none}
button,input,textarea{font:inherit;color:inherit}
.price,.totalrow strong,#cart .t,.sum .row span:last-child,.facts li{font-variant-numeric:tabular-nums lining-nums}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
.glass{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--shadow)}
@media (prefers-reduced-transparency:reduce){.glass,.bar,#cart{background:var(--glass-strong)!important;}}

/* top */
.top{margin-top:0;padding:26px 2px 10px}
.brand{font-weight:800;font-size:46px;letter-spacing:-.04em;line-height:.95;color:var(--ink)}
.brand span{color:var(--gold)}
.top .tag{margin:10px 0 0;color:var(--mute);font-size:15.5px;line-height:1.45;max-width:30ch}
.facts{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0}
.facts li{background:transparent;border:1px solid var(--glass-edge);border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:700;letter-spacing:.005em}
.cutoff{margin:14px 0 0;font-size:13.5px;color:var(--gold-ink);background:var(--gold-soft);border-radius:16px;padding:10px 12px}

/* filters */
.bar{position:sticky;top:0;z-index:20;padding:10px 0;margin-top:6px;background:var(--page);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 14px;margin:0 -14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 18px;letter-spacing:-.005em;border-radius:99px;border:1px solid var(--glass-edge);background:var(--glass);font-weight:700;font-size:14.5px;cursor:pointer;touch-action:manipulation;transition:transform .15s}
.chip:active{transform:scale(.97)}
.chip[aria-pressed=true]{background:var(--accent);border-color:transparent;color:var(--on-accent)}

/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 0 8px}
.card{border-radius:22px;overflow:hidden;display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .5s cubic-bezier(.16,1,.3,1) both}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}}
.ph{position:relative;aspect-ratio:3/4;background:linear-gradient(160deg,var(--ph1),var(--ph2));display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.has{cursor:pointer}
.ph .nophoto{padding:16px;text-align:center;font-weight:800;font-size:19px;line-height:1.15;color:var(--accent-solid);letter-spacing:-.012em;word-spacing:.05em}
.ph .more{position:absolute;right:10px;bottom:10px;background:rgba(30,12,20,.55);color:#fff;font-size:12px;font-weight:650;padding:5px 10px;border-radius:99px;display:none}
.ph.multi .more{display:block}
.info{padding:12px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.badge{font-size:12px;font-weight:700;color:var(--gold-ink);letter-spacing:.01em}
.badge.ship{color:var(--mute);font-weight:650}
.name{font-weight:700;font-size:16px;line-height:1.22;letter-spacing:-.008em;word-spacing:.04em;margin-top:2px}
.code{font-size:12px;color:var(--mute)}
.desc{font-size:13px;color:var(--mute)}
.price{font-weight:800;font-size:21px;margin-top:8px;letter-spacing:-.03em}
.ctl{margin-top:auto;padding-top:8px}
.add{width:100%;min-height:44px;border-radius:99px;border:0;background:var(--accent);color:var(--on-accent);font-weight:800;letter-spacing:-.005em;cursor:pointer;touch-action:manipulation;transition:transform .15s}
.add:active{transform:scale(.97)}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--line);border-radius:99px;min-height:44px}
.step button{width:46px;height:44px;border:0;background:transparent;color:var(--accent-solid);font-size:22px;font-weight:700;cursor:pointer;touch-action:manipulation}
.step output{font-weight:800;font-size:17px}
.colors{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sw{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--glass-edge);background:var(--glass);font-weight:700;font-size:13.5px;cursor:pointer;touch-action:manipulation}
.sw[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.sw.dot{width:44px;height:44px;padding:0;border-radius:50%;border:1px solid var(--glass-edge);box-shadow:inset 0 0 0 2px var(--glass)}
.sw.dot[aria-pressed=true]{border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--glass)}
.csel{width:100%;font-size:12.5px;font-weight:700;color:var(--mute);margin-top:2px}
.cerr{font-size:12.5px;color:var(--err);font-weight:700;margin-top:6px}
.cerr:empty{display:none}
.hide{display:none!important}

/* order form */
section.order{padding-top:30px}
h2{font-size:30px;font-weight:800;letter-spacing:-.03em;word-spacing:.03em;line-height:1.05;margin:0 0 6px}
.sub{margin:0 0 14px;color:var(--mute);font-size:15px;max-width:34ch}
.panel{background:var(--glass);border:1px solid var(--glass-edge);border-radius:22px;padding:18px;margin-top:12px;box-shadow:var(--shadow)}
label.f{display:block;font-weight:700;font-size:13.5px;letter-spacing:.01em;margin:14px 0 6px}
label.f:first-child{margin-top:0}
input[type=text],input[type=tel],textarea{width:100%;font-size:16px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--glass-strong);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.9}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{border-color:var(--gold);outline:0;box-shadow:0 0 0 4px var(--gold-soft)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--glass-strong);min-height:54px;cursor:pointer;transition:border-color .15s,background .15s}
.opt input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent-solid);flex:none}
.opt b{display:block;font-weight:700;font-size:15px}
.opt small{display:block;color:var(--mute);font-size:13px;margin-top:1px}
.opt.sel{border-color:var(--accent-solid);background:var(--accent-soft)}
.opt.dis{opacity:.5;cursor:not-allowed}
.err{color:var(--err);font-size:13.5px;margin-top:6px;font-weight:650}
.err:empty{display:none}

.sum{font-size:14.5px}
.sum .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;color:var(--mute)}
.sum .row span:last-child{color:var(--ink);font-weight:650;white-space:nowrap}
.sum .empty{color:var(--mute)}
.totalrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.totalrow span{font-weight:700}
.totalrow strong{font-size:36px;font-weight:800;letter-spacing:-.045em}
.note{font-size:13.5px;color:var(--gold-ink);background:var(--gold-soft);border-radius:16px;padding:10px 12px;margin-top:12px}
#go{width:100%;margin-top:16px;min-height:58px;border:0;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:800;letter-spacing:-.01em;cursor:pointer;touch-action:manipulation;transition:transform .15s}
#go:active{transform:scale(.985)}
#done{margin-top:14px;padding:18px;border-radius:22px;background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold-ink);font-weight:650}
#done p{margin:0 0 8px}#done p:last-child{margin:0}
#done a{color:inherit;font-weight:650}
footer{text-align:center;color:var(--mute);font-size:13.5px;padding:28px 16px 12px}

/* cart pill */
#cart{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:696px;margin:0 auto;z-index:30;padding:10px 10px 10px 20px;border-radius:99px;background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:0 6px 24px -8px rgba(40,20,15,.28);transform:translateY(160%);transition:transform .3s cubic-bezier(.16,1,.3,1)}
#cart.on{transform:none}
#cart .in{display:flex;align-items:center;justify-content:space-between;gap:12px}
#cart .n{font-size:13px;color:var(--mute)}
#cart .t{font-weight:800;font-size:22px;line-height:1.05;letter-spacing:-.035em}
#cart a{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-weight:800;text-decoration:none}

/* gallery */
#gal{position:fixed;inset:0;background:#130a14;z-index:50;display:none;flex-direction:column}
#gal.on{display:flex}
#gal header{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 18px;color:#fff}
#gal .t{font-weight:700;font-size:15px}
#gal .c{font-size:13px;opacity:.8}
#gx{width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:28px;line-height:1;cursor:pointer;touch-action:manipulation}
#gs{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
#gs::-webkit-scrollbar{display:none}
#gs .sl{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:8px}
#gs img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:22px}
#gd{display:flex;justify-content:center;gap:8px;padding:14px}
#gd i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35)}
#gd i.on{background:#f6d99a}

@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}#cart,#go,.add,.chip{transition:none}}
</style>
</head>

<script>

  {code:"P-09", name:"Toy car",                    price:349,  preDiwali:false, description:""},

<script>
(function(){
  function withTimeout(p, ms){ return Promise.race([p, new Promise(function(res){ setTimeout(function(){ res(null); }, ms); })]); }
  // Live data lives in products.json (edited from /admin). Anything invalid is ignored.
  function loadData(){
    if (!window.fetch) return Promise.resolve(null);
    return withTimeout(fetch("products.json", {cache:"no-cache"}).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }), 2500);
  }
  function str(v, max){ return typeof v === "string" && v.length <= max ? v : null; }
  // A colour is {name, hex}. A plain string is still accepted (name only, no swatch).
  function normColor(c){
    if (typeof c === "string"){ var n = c.trim(); return n && n.length <= 20 ? {name:n, hex:null} : null; }
    if (c && typeof c === "object" && str(c.name, 20) && c.name.trim()){
      return {name:c.name.trim(), hex:(typeof c.hex === "string" && /^#[0-9a-fA-F]{6}$/.test(c.hex)) ? c.hex.toLowerCase() : null};
    }
    return null;
  }
  function applyData(d){
    if (!d || typeof d !== "object") return;
    var st = d.settings || {};
    if (/^\d{10,15}$/.test(String(st.whatsappNumber || ""))) WHATSAPP_NUMBER = String(st.whatsappNumber);
    if (st.noidaFee === null || (typeof st.noidaFee === "number" && st.noidaFee >= 0 && st.noidaFee < 100000)) NOIDA_DELIVERY_FEE = st.noidaFee;
    if (str(st.shipDays, 24)) SHIP_DAYS = st.shipDays;
    if (str(st.preDiwaliCutoff, 40)) PRE_DIWALI_CUTOFF = st.preDiwaliCutoff;
    if (Array.isArray(d.products)){
      var seen = {}, list = [];
      d.products.forEach(function(p){
        if (!p || !/^[A-Za-z0-9-]{1,12}$/.test(p.code || "") || seen[p.code]) return;
        var name = str(p.name, 80), price = p.price;
        if (!name || !name.trim() || typeof price !== "number" || !(price > 0) || price > 1000000) return;
        seen[p.code] = 1;
        var o = {code:p.code, name:name.trim(), price:Math.round(price), preDiwali:p.preDiwali === true, description:str(p.description, 200) || ""};
        if (str(p.ship, 40) && p.ship.trim()) o.ship = p.ship.trim();
        if (Array.isArray(p.colors)){ var cs = p.colors.map(normColor).filter(Boolean).slice(0, 8); if (cs.length) o.colors = cs; }
        list.push(o);
      });
      if (list.length) PRODUCTS = list;
    }
  }
  loadData().then(function(d){
    applyData(d);
    // Check which products have a photo, so items without one can sit at the bottom.
    var checks = PRODUCTS.map(function(p){
      return window.fetch ? fetch("photos/" + p.code + "-1.jpg", {method:"HEAD"}).then(function(r){ return r.ok; }).catch(function(){ return false; }) : Promise.resolve(true);
    });
    return withTimeout(Promise.all(checks), 2500);
  }).then(function(has){ init(has); });

  function init(has){
  var qty = {}, color = {};
  var $ = function(id){return document.getElementById(id)};
  var rs = function(n){return "₹" + n};
  var rsf = function(n){return "₹" + n.toLocaleString("en-IN")};
  var feeOk = typeof NOIDA_DELIVERY_FEE === "number" && NOIDA_DELIVERY_FEE >= 0;

  // ---- top strip ----
  [ "Stall pickup", feeOk ? "Noida delivery +" + rsf(NOIDA_DELIVERY_FEE) : "" ].forEach(function(t){
    if (!t) return; var li = document.createElement("li"); li.textContent = t; $("facts").appendChild(li);
  });
  $("cutoff").textContent = "Order Before Diwali items by " + PRE_DIWALI_CUTOFF + ". Other items ship in " + SHIP_DAYS + ".";

  // ---- grid ----
  var grid = $("grid"), cardEl = {};
  var ordered = PRODUCTS.slice();
  if (has){ ordered = PRODUCTS.filter(function(p,i){ return has[i]; }).concat(PRODUCTS.filter(function(p,i){ return !has[i]; })); }
  function itemName(p){ return p.name + (color[p.code] ? " (" + color[p.code] + ")" : ""); }
  ordered.forEach(function(p){
    qty[p.code] = 0;
    var c = document.createElement("article"); c.className = "card"; c.dataset.code = p.code; c.dataset.group = p.code.charAt(0).toUpperCase() === "C" ? "C" : "P"; c.dataset.pre = p.preDiwali ? "1" : "0";
    cardEl[p.code] = c;
    var ph = document.createElement("div"); ph.className = "ph";
    var np = document.createElement("div"); np.className = "nophoto"; np.textContent = p.name; ph.appendChild(np);
    var more = document.createElement("span"); more.className = "more"; more.textContent = "More photos"; ph.appendChild(more);
    var img = new Image(); img.alt = p.name; img.decoding = "async";
    img.onload = function(){ np.remove(); ph.insertBefore(img, ph.firstChild); ph.classList.add("has");
      ph.setAttribute("role","button"); ph.setAttribute("tabindex","0"); ph.setAttribute("aria-label","View photos of " + p.name);
      ph.onclick = function(){ openGal(p, ph); };
      ph.onkeydown = function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openGal(p, ph); } };
      var t = new Image(); t.onload = function(){ ph.classList.add("multi"); }; t.src = "photos/" + p.code + "-2.jpg"; };
    (function(){ var go = function(){ img.src = "photos/" + p.code + "-1.jpg"; };
      if ("IntersectionObserver" in window){ var io = new IntersectionObserver(function(es){ if (es[0].isIntersecting){ io.disconnect(); go(); } }, {rootMargin:"300px"}); io.observe(ph); } else go(); })();
    var b = document.createElement("div"); b.className = "info";
    var badge = document.createElement("span"); badge.className = "badge" + (p.preDiwali ? "" : " ship"); badge.textContent = p.ship || (p.preDiwali ? "Before Diwali" : "Ships in " + SHIP_DAYS);
    var nm = document.createElement("div"); nm.className = "name"; nm.textContent = p.name;
    b.appendChild(badge); b.appendChild(nm);
    if (p.description){ var d = document.createElement("div"); d.className = "desc"; d.textContent = p.description; b.appendChild(d); }
    var pr = document.createElement("div"); pr.className = "price"; pr.textContent = rsf(p.price); b.appendChild(pr);
    var cerr = document.createElement("div"); cerr.className = "cerr"; cerr.setAttribute("role","alert");
    if (p.colors && p.colors.length){
      var cw = document.createElement("div"); cw.className = "colors"; cw.setAttribute("role","group"); cw.setAttribute("aria-label","Colour for " + p.name);
      var csel = document.createElement("div"); csel.className = "csel"; csel.textContent = "Choose a colour";
      p.colors.forEach(function(col){
        var sw = document.createElement("button"); sw.type = "button"; sw.className = "sw" + (col.hex ? " dot" : ""); sw.setAttribute("aria-pressed","false");
        if (col.hex){ sw.style.background = col.hex; sw.setAttribute("aria-label", col.name); sw.title = col.name; } else sw.textContent = col.name;
        sw.onclick = function(){ color[p.code] = col.name; cerr.textContent = ""; csel.textContent = "Colour: " + col.name;
          Array.prototype.forEach.call(cw.querySelectorAll(".sw"), function(x){ x.setAttribute("aria-pressed", x === sw ? "true" : "false"); }); upd(); };
        cw.appendChild(sw); });
      cw.appendChild(csel);
      b.appendChild(cw);
    }
    b.appendChild(cerr);
    var ctl = document.createElement("div"); ctl.className = "ctl";
    var add = document.createElement("button"); add.type = "button"; add.className = "add"; add.textContent = "Add"; add.setAttribute("aria-label","Add " + p.name);
    var st = document.createElement("div"); st.className = "step hide";
    var m = document.createElement("button"); m.type = "button"; m.textContent = "−"; m.setAttribute("aria-label","Remove one " + p.name);
    var o = document.createElement("output"); o.setAttribute("aria-label","Quantity");
    var a = document.createElement("button"); a.type = "button"; a.textContent = "+"; a.setAttribute("aria-label","Add one " + p.name);
    add.onclick = function(){ if (p.colors && p.colors.length && !color[p.code]){ cerr.textContent = "Choose a colour first"; return; } qty[p.code] = 1; upd(); };
    m.onclick = function(){ if (qty[p.code] > 0){ qty[p.code]--; upd(); } };
    a.onclick = function(){ if (qty[p.code] < 20){ qty[p.code]++; upd(); } };
    st.appendChild(m); st.appendChild(o); st.appendChild(a); ctl.appendChild(add); ctl.appendChild(st); b.appendChild(ctl);
    c._add = add; c._st = st; c._o = o;
    c.appendChild(ph); c.appendChild(b); grid.appendChild(c);
  });

  // ---- filters ----
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(ch){
    ch.onclick = function(){
      Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(x){ x.setAttribute("aria-pressed", x === ch ? "true" : "false"); });
      var f = ch.dataset.f;
      PRODUCTS.forEach(function(p){ var c = cardEl[p.code];
        var show = f === "all" || (f === "pre" && p.preDiwali) || f === c.dataset.group;
        c.classList.toggle("hide", !show); });
    };
  });

  // ---- gallery ----
  var gal = $("gal"), gs = $("gs"), gd = $("gd"), lastFocus = null;
  function openGal(p, from){
    lastFocus = from; gs.innerHTML = ""; gd.innerHTML = "";
    $("gt").textContent = p.name + " (" + p.code + ")";
    function refresh(){
      var slides = gs.children;
      $("gc").textContent = slides.length > 1 ? "Swipe for more. " + slides.length + " photos" : "";
      gd.innerHTML = ""; for (var i = 0; i < slides.length && slides.length > 1; i++){ gd.appendChild(document.createElement("i")); }
      dots();
    }
    for (var k = 1; k <= 5; k++) (function(k){
      var sl = document.createElement("div"); sl.className = "sl"; sl.dataset.k = k;
      var im = new Image(); im.alt = p.name + " photo " + k; im.decoding = "async";
      im.onload = function(){ sl.appendChild(im); var kids = gs.children, at = null;
        for (var j = 0; j < kids.length; j++){ if (+kids[j].dataset.k > k){ at = kids[j]; break; } }
        gs.insertBefore(sl, at); refresh(); };
      im.src = "photos/" + p.code + "-" + k + ".jpg";
    })(k);
    gal.classList.add("on"); document.body.style.overflow = "hidden"; $("gx").focus();
  }
  function dots(){ var w = gs.clientWidth || 1, i = Math.round(gs.scrollLeft / w), d = gd.children; for (var j = 0; j < d.length; j++) d[j].className = j === i ? "on" : ""; }
  gs.addEventListener("scroll", dots, {passive:true});
  function closeGal(){ gal.classList.remove("on"); document.body.style.overflow = ""; gs.innerHTML = ""; if (lastFocus) lastFocus.focus(); }
  $("gx").onclick = closeGal;
  gal.addEventListener("click", function(e){ if (e.target === gal || e.target === gs || e.target.className === "sl") closeGal(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && gal.classList.contains("on")) closeGal(); });

  // ---- delivery option labels ----
  if (feeOk){ $("noida-t").textContent = "Noida delivery (+" + rsf(NOIDA_DELIVERY_FEE) + ")"; }
  else { $("noida-s").textContent = "Not available yet"; document.querySelector('input[value="Noida"]').disabled = true; $("o-Noida").classList.add("dis"); }

  function dtype(){ return document.querySelector('input[name="dt"]:checked').value; }
  function fee(){ return dtype() === "Noida" && feeOk ? NOIDA_DELIVERY_FEE : 0; }
  function subtotal(){ return PRODUCTS.reduce(function(s,p){return s + p.price * qty[p.code]}, 0); }
  function esc(s){ return s.replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}); }

  function upd(){
    var dt = dtype(), sub = subtotal(), count = 0, pre = false, late = false, lines = "";
    PRODUCTS.forEach(function(p){
      var c = cardEl[p.code], q = qty[p.code];
      c._add.classList.toggle("hide", q > 0); c._st.classList.toggle("hide", q === 0); c._o.textContent = q;
      if (q){ count += q; if (p.preDiwali) pre = true; else late = true;
        lines += '<div class="row"><span>' + esc(itemName(p)) + " ×" + q + "</span><span>" + rsf(p.price * q) + "</span></div>"; }
    });
    ["Pickup","Noida"].forEach(function(k){ $("o-" + k).classList.toggle("sel", k === dt); });
    $("noi").classList.toggle("hide", dt !== "Noida");
    if (fee()) lines += '<div class="row"><span>Noida delivery</span><span>' + rsf(fee()) + "</span></div>";
    $("lines").innerHTML = lines || '<div class="row empty"><span>No items yet. Tap Add on any product.</span></div>';
    var total = sub + fee();
    $("total").textContent = rsf(total);
    var mn = $("mixnote");
    if (pre && late){ mn.textContent = "Your order has items for before Diwali (by " + PRE_DIWALI_CUTOFF + ") and items that ship in " + SHIP_DAYS + "."; mn.classList.remove("hide"); }
    else mn.classList.add("hide");
    $("cn").textContent = count + (count === 1 ? " item" : " items");
    $("ct").textContent = rsf(total);
    $("cart").classList.toggle("on", count > 0);
  }
  Array.prototype.forEach.call(document.querySelectorAll('input[name="dt"]'), function(r){ r.onchange = upd; });

  // ---- message (format is parsed by an automation: do not change) ----
  function clean(s){ return String(s || "").replace(/[\r\n\t]+/g, " ").replace(/[|;]/g, ",").replace(/\s+/g, " ").trim(); }
  function makeId(){
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", t = Date.now().toString(36).toUpperCase().slice(-3), r = "";
    var buf = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(3)) : [Math.random()*256, Math.random()*256, Math.random()*256];
    for (var i = 0; i < 3; i++) r += chars.charAt(Math.floor(buf[i]) % chars.length);
    return "KK-" + t + r;
  }
  function phoneDigits(v){
    var d = String(v).replace(/\D/g, "");
    if (d.length === 12 && d.indexOf("91") === 0) d = d.slice(2);
    else if (d.length === 11 && d.charAt(0) === "0") d = d.slice(1);
    return /^[6-9]\d{9}$/.test(d) ? d : "";
  }
  function build(){
    var errs = {cart:"", name:"", phone:"", noi:""}, ok = true;
    var dt = dtype();
    if (!subtotal()){ errs.cart = "Please add at least one item."; ok = false; }
    var name = clean($("name").value);
    if (!name){ errs.name = "Please enter your name."; ok = false; }
    var phone = phoneDigits($("phone").value);
    if (!phone){ errs.phone = "Enter a valid 10-digit mobile number."; ok = false; }
    var addr = "-";
    if (dt === "Pickup") addr = "Stall";
    if (dt === "Noida"){
      var ad = clean($("addr").value), pin = $("pin").value.replace(/\s/g, "");
      if (!ad || !/^\d{6}$/.test(pin)){ errs.noi = "Full address and a 6-digit pincode are required."; ok = false; }
      addr = ad + ", " + pin;
    }
    $("e-cart").textContent = errs.cart; $("e-name").textContent = errs.name; $("e-phone").textContent = errs.phone;
    $("e-noi").textContent = errs.noi;
    if (!ok) return null;
    var items = PRODUCTS.filter(function(p){return qty[p.code]}).map(function(p){
      return p.code + " " + itemName(p) + " x" + qty[p.code] + " = " + rs(p.price * qty[p.code]);
    }).join("; ");
    var id = makeId();
    var msg = "ORDER " + id + "\n" +
      "Items: " + items + "\n" +
      "Delivery: " + dt + " | " + addr + "\n" +
      "Total: " + rs(subtotal() + fee()) + "\n" +
      "Name: " + name + " | Phone: " + phone + "\n" +
      "Notes: " + (clean($("notes").value) || "-");
    return {msg: msg, dt: dt};
  }

  $("go").onclick = function(){
    var r = build();
    if (!r){
      var first = document.querySelector(".err:not(:empty)");
      if (first && first.scrollIntoView) first.scrollIntoView({block:"center", behavior:"smooth"});
      return;
    }
    var url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(r.msg);
    var d = $("done");
    d.innerHTML = "<p>Send the WhatsApp message to confirm. We'll reply with UPI payment details.</p>" +
      (r.dt === "Noida" ? "<p>Payment is required before dispatch.</p>" : "") +
      '<p><a id="again" href="' + url + '" target="_blank" rel="noopener">WhatsApp did not open? Tap here</a></p>';
    d.classList.remove("hide");
    window.open(url, "_blank");
    if (d.scrollIntoView) d.scrollIntoView({block:"center", behavior:"smooth"});
  };

  upd();
  }
})();
</script>
</body>
</html>
